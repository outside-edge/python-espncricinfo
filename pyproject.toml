[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-espncricinfo"
version = "1.0.0"
description = "ESPNCricInfo API client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "Derek Willis", email = "dwillis@gmail.com"}]
keywords = ["espncricinfo", "cricket", "t20", "odi"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3"]
dependencies = ["requests", "beautifulsoup4", "dateparser", "lxml", "playwright>=1.48.0"]

[project.urls]
Repository = "https://github.com/outside-edge/python-espncricinfo"
Issues = "https://github.com/outside-edge/python-espncricinfo/issues"

[dependency-groups]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
include = ["espncricinfo*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
